<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Manager</title>

    <link rel="stylesheet" href="styles/main.css" />
  </head>

  <body>
    <!-- ==============================
       SIDEBAR
  =============================== -->

    <aside class="sidebar">
      <div class="logo">
        <p>Task Manager</p>
      </div>

      <nav class="navbar">
        <a href="#" id="dashboardLink"> Dashboard </a>

        <hr />

        <a href="#" id="myTasksLink"> My Tasks </a>

        <hr />

        <a href="#" id="completedLink"> Completed </a>

        <hr />
      </nav>

      <div class="sidebar-bottom">
        <a href="#" id="settingsLink"> Settings </a>
      </div>
    </aside>

    <!-- ==============================
       MAIN CONTENT
  =============================== -->

    <main class="main-content">
      <!-- ==============================
         HEADER
    =============================== -->

      <header class="top-header">
        <div class="welcome">
          <h1>Good afternoon!</h1>

          <p>Here's what you need to get done today.</p>
        </div>

        <div class="header-actions">
          <button id="searchBtn" title="Search">🔍</button>

          <button id="notificationBtn" title="Notifications">🔔</button>

          <div class="profile">A</div>
        </div>
      </header>

      <!-- ==============================
         STATISTICS
    =============================== -->

      <section class="stats">
        <div class="stat-card">
          <p>Total Tasks</p>

          <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
          <p>Pending</p>

          <h2 id="pendingTasks">0</h2>
        </div>

        <div class="stat-card">
          <p>Completed</p>

          <h2 id="completedTasks">0</h2>
        </div>
      </section>

      <!-- ==============================
         TASK SECTION
    =============================== -->

      <section class="tasks-section">
        <div class="tasks-header">
          <div>
            <h2>My Tasks</h2>

            <p>Keep track of what you need to accomplish.</p>
          </div>

          <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
        </div>

        <!-- ==============================
           SEARCH AND FILTER
      =============================== -->

        <div class="task-controls">
          <input type="text" id="searchInput" placeholder="Search tasks..." />

          <select id="filterSelect">
            <option value="all">All</option>

            <option value="pending">Pending</option>

            <option value="completed">Completed</option>
          </select>
        </div>

        <!-- ==============================
           ADD / EDIT TASK FORM
      =============================== -->

        <div class="task-form" id="taskForm">
          <input type="text" id="taskTitle" placeholder="Task title" />

          <input
            type="text"
            id="taskDescription"
            placeholder="Task description"
          />

          <select id="taskPriority">
            <option value="High">High</option>

            <option value="Medium">Medium</option>

            <option value="Low">Low</option>
          </select>

          <button id="saveTaskBtn">Save Task</button>
        </div>

        <!-- ==============================
           TASK LIST
      =============================== -->

        <div class="task-list" id="taskList"></div>
      </section>

      <!-- ==============================
         PROGRESS
    =============================== -->

      <section class="progress-section">
        <div class="progress-header">
          <div>
            <h2>Today's Progress</h2>

            <p id="progressText">0 of 0 tasks completed</p>
          </div>

          <span class="progress-percentage" id="progressPercentage"> 0% </span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </section>
    </main>

    <!-- ==============================
       JAVASCRIPT
  =============================== -->

    <script src="scripts/main.js"></script>
  </body>
</html>
